name: Toolkit checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate sample captions
        run: python tools/validate_captions.py examples/sample-captions.srt examples/sample-captions.vtt examples/short-form-captions.srt examples/short-form-captions.vtt
